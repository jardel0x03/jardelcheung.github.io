name: Deploy to Aliyun ECS By oidc

on:
  push:
    branches:
      - master
  #    paths:
  #      - 'index.html'
  #      - '.github/workflows/**'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ROLE_ARN: acs:ram::1238311235538497:role/github-actions-deploy-role
      OIDC_PROVIDER_ARN: acs:ram::1238311235538497:oidc-provider/github
      OIDC_AUDIENCE: sts.aliyuncs.com
      REGION_ID: cn-beijing
      ECS_INSTANCE_ID: ${{ secrets.ECS_INSTANCE_ID }}
      WEB_ROOT: ${{ secrets.ECS_TARGET_PATH }}

    steps:
      - uses: actions/checkout@v4
      - name: Install deps (aliyun-cli, jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz | sudo tar -xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/aliyun
      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          # ACTIONS_ID_TOKEN_REQUEST_URL 通常已带 querystring，所以用 &audience=
          OIDC_JSON="$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          echo "token=$(echo "$OIDC_JSON" | jq -r '.value')" >> "$GITHUB_OUTPUT"
      - name: Assume role with OIDC (STS)
        id: sts
        shell: bash
        run: |
          set -euo pipefail
          CREDS="$(aliyun sts AssumeRoleWithOIDC \
            --RoleArn "$ROLE_ARN" \
            --OIDCProviderArn "$OIDC_PROVIDER_ARN" \
            --OIDCToken "${{ steps.oidc.outputs.token }}" \
            --RoleSessionName "github-${GITHUB_RUN_ID}" \
            --DurationSeconds 3600)"
          echo "ALIBABA_CLOUD_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')" >> "$GITHUB_ENV"
          echo "ALIBABA_CLOUD_ACCESS_KEY_SECRET=$(echo "$CREDS" | jq -r '.Credentials.AccessKeySecret')" >> "$GITHUB_ENV"
          echo "ALIBABA_CLOUD_SECURITY_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SecurityToken')" >> "$GITHUB_ENV"
          echo "ALIBABA_CLOUD_REGION_ID=${REGION_ID}" >> "$GITHUB_ENV"
      - name: Verify identity
        run: |
          aliyun sts GetCallerIdentity
      - name: Do your deployment
        run: |
          # 示例：列 OSS buckets（需权限）
          aliyun oss ls
      - name: Archive site files
        run: |
          set -euo pipefail
          tar czf site.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            .
      - name: Upload archive to ECS temp path
        env:
          ECS_INSTANCE_ID: ${{ env.ECS_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # Cloud Assistant 临时文件上传到 /usr/local/cloudshell/tmp 或 /tmp 等位置
          # 这里使用 ecs UploadFile（部分地域已支持，如不支持可改回 SSH/rsync 方案）
          FILE_CONTENT_BASE64=$(base64 -w0 site.tar.gz)
          RESP=$(aliyun ecs UploadFile \
            --RegionId "${ALIBABA_CLOUD_REGION_ID}" \
            --InstanceId "${ECS_INSTANCE_ID}" \
            --FileName "/tmp/site.tar.gz" \
            --Content "${FILE_CONTENT_BASE64}")
          echo "UploadFile response: ${RESP}"
      - name: Deploy on ECS from uploaded archive
        env:
          ECS_INSTANCE_ID: ${{ env.ECS_INSTANCE_ID }}
          WEB_ROOT: ${{ env.WEB_ROOT }}
        run: |
          set -euo pipefail
          # 在 ECS 上解压 /tmp/site.tar.gz 并同步到 WEB_ROOT
          COMMAND_CONTENT=$(cat <<'EOF'
          #!/bin/bash
          set -euo pipefail
          ARCHIVE="/tmp/site.tar.gz"
          WEB_ROOT="${WEB_ROOT}"
          TMP_DIR="/tmp/site-deploy-$$"

          mkdir -p "${TMP_DIR}"
          if [ -f "${ARCHIVE}" ]; then
            tar xzf "${ARCHIVE}" -C "${TMP_DIR}"
          else
            echo "Archive not found: ${ARCHIVE}" >&2
            exit 1
          fi

          mkdir -p "${WEB_ROOT}"
          rsync -av --delete "${TMP_DIR}/" "${WEB_ROOT}/"

          rm -rf "${TMP_DIR}" "${ARCHIVE}"
          EOF
          )

          aliyun ecs RunCommand \
            --RegionId "${ALIBABA_CLOUD_REGION_ID}" \
            --Type "RunShellScript" \
            --InstanceIds '["'"${ECS_INSTANCE_ID}"'"]' \
            --CommandContent "${COMMAND_CONTENT}"
